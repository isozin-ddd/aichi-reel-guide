<svg xmlns="http://www.w3.org/2000/svg" viewBox="95 70 880 880">
<defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="72%"><stop offset="0" stop-color="#253457"/><stop offset="1" stop-color="#121a2f"/></radialGradient>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="300" y1="120" x2="780" y2="900">
      <stop offset="0" stop-color="#FFEDB0"/><stop offset="0.55" stop-color="#F2C45E"/><stop offset="1" stop-color="#D9982F"/>
    </linearGradient>
    <linearGradient id="gold2" gradientUnits="userSpaceOnUse" x1="300" y1="120" x2="780" y2="900">
      <stop offset="0" stop-color="#FFE59A"/><stop offset="1" stop-color="#E7A93E"/>
    </linearGradient>
  </defs>
<rect x="95" y="70" width="880" height="880" rx="190" fill="#172038"/>
<g transform="translate(0,0)">
    <!-- tail: three round lobes, like a little crown -->
    <g fill="url(#gold2)">
      <ellipse cx="505" cy="235" rx="58" ry="92" transform="rotate(-38 505 235)"/>
      <ellipse cx="600" cy="200" rx="56" ry="95" transform="rotate(4 600 200)"/>
      <ellipse cx="690" cy="245" rx="58" ry="90" transform="rotate(42 690 245)"/>
    </g>
    <!-- dorsal fin: soft scallops along the back -->
    <g fill="url(#gold2)">
      <circle cx="668" cy="370" r="30"/><circle cx="682" cy="430" r="32"/><circle cx="700" cy="492" r="32"/><circle cx="725" cy="550" r="30"/>
    </g>
    <!-- body: plump curve rising from the head to the tail -->
    <path fill="url(#gold)" d="M 370 640
      C 340 500 420 360 560 300
      C 600 285 640 292 655 318
      C 640 400 650 480 700 560
      C 720 600 700 640 660 640 Z"/>
    <!-- belly scales -->
    
    <!-- little fins like hands -->
    <ellipse cx="318" cy="735" rx="62" ry="38" transform="rotate(-25 318 735)" fill="url(#gold2)"/>
    <ellipse cx="748" cy="740" rx="62" ry="38" transform="rotate(25 748 740)" fill="url(#gold2)"/>
    <!-- head: big and round -->
    <ellipse cx="533" cy="720" rx="215" ry="175" fill="url(#gold)"/>
    <!-- little mane curls on the sides of the head -->
    <g fill="url(#gold2)">
      <path d="M 342 650 c -40 -10 -62 -48 -50 -88 c 14 30 36 44 70 46 z"/>
      <path d="M 724 650 c 40 -10 62 -48 50 -88 c -14 30 -36 44 -70 46 z"/>
    </g>
    <!-- face -->
    <g>
      <ellipse cx="458" cy="712" rx="40" ry="48" fill="#1B2440"/>
      <ellipse cx="608" cy="712" rx="40" ry="48" fill="#1B2440"/>
      <circle cx="472" cy="694" r="15" fill="#fff"/><circle cx="448" cy="728" r="7" fill="#fff" opacity="0.85"/>
      <circle cx="622" cy="694" r="15" fill="#fff"/><circle cx="598" cy="728" r="7" fill="#fff" opacity="0.85"/>
      <ellipse cx="390" cy="790" rx="38" ry="22" fill="#F4917A" opacity="0.55"/>
      <ellipse cx="676" cy="790" rx="38" ry="22" fill="#F4917A" opacity="0.55"/>
      <path d="M 544 797 l 15 0 l -7 20 z" fill="#fff"/>
      <path d="M 503 790 q 15 22 30 0 q 15 22 30 0" fill="none" stroke="#1B2440" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>